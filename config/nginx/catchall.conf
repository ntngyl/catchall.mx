server {
    listen 80;
    server_name catchall.mx www.catchall.mx mail.catchall.mx 142.11.231.215;
    
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name catchall.mx www.catchall.mx mail.catchall.mx;
    
    ssl_certificate /etc/letsencrypt/live/catchall.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catchall.mx/privkey.pem;
    
    root /var/www/catchall;
    index index.html;
    
    # Static files
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Private visitor statistics (generated by GoAccess from the access log)
    location = /stats { return 301 /stats/; }
    location /stats/ {
        alias /var/www/stats/;
        auth_basic "catchall.mx stats";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # API endpoint for DNS checker
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # Verification handler
    location /verify/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # DKIM setup and verification
    location /dkim/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Abuse reporting
    location /report {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Quarantine dashboard
    location /quarantine {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
}
