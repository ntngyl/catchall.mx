# Visits arriving with ?ref=tag or ?utm_source=tag are logged with the
# referrer "https://tag.link-tag/" so they show up as a source in the stats.
map $arg_ref $ref_tag {
    default "";
    "~*^(?<t>[a-z0-9_-]{1,30})$" "https://$t.link-tag/";
}
map $arg_utm_source $utm_tag {
    default $ref_tag;
    "~*^(?<u>[a-z0-9_-]{1,30})$" "https://$u.link-tag/";
}
map $utm_tag $log_referer {
    default $utm_tag;
    "" $http_referer;
}
log_format stats '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$log_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log stats;
